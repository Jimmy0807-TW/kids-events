# 親子活動週報 設定檔
# 在 GitHub 網頁上按右上角鉛筆圖示即可修改，改完按「Commit changes」，下次更新就會套用。
# 「:」後面要留一個空白；清單用「- 」開頭。

# 孩子年齡（活動適齡範圍與此區間有重疊就收）
年齡下限: 6
年齡上限: 8

# 價格（元）：最低票價超過上限不收；低於等於門檻歸為「② 500 元以下」
價格上限: 1000
低價門檻: 500

# 只收今天起幾天內有場次的活動
往後看幾天: 60

# 活動期間超過幾天算「長期展覽」（網頁預設隱藏）
長期展覽天數: 45

# 常用地區：網頁預設顯示、LINE 週報主要內容
常用地區:
  - 臺北市
  - 新北市
  - 基隆市
  - 桃園市

# 這些來源的活動數量多，不放在主清單，改成網頁上方一個獨立按鈕
獨立按鈕來源:
  - 科教館

# 活動名稱含這些字一律不收（內建已排除：樂齡、銀髮、成人、志工、招募、徵件、說明會 等）
額外排除關鍵字: []

# 資料來源開關（開／關）
來源:
  文化部: 開
  觀光署: 開
  北市圖: 開
  新北圖: 開
  科教館: 開
  桃園市民卡: 開
  ACCUPASS: 開
  花博公園: 開
  華山1914: 開
  松山文創園區: 開
  新聞線索: 開

# LINE 週報
LINE:
  週報星期: 四          # 一～日
  週末活動筆數: 10
  本週新增筆數: 10
  市集節慶筆數: 5
  外縣市精選筆數: 5
  報名提醒: 開          # 有活動「明天開放報名」時，前一天傍晚提醒

# 網頁網址（GitHub Pages 開好後自動填入，一般不用改）
網頁網址: https://jimmy0807-tw.github.io/kids-events/
